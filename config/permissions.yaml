# Política de permisos de ARGOS. Se evalúa SIEMPRE en el orden: deny -> ask -> allow.
#
# Principio "Least Agency" (OWASP Top 10 for Agentic Applications 2026):
# la autonomía es una capacidad que se GANA, no un valor por defecto.
#
# Dos controles independientes, y ambos deben pasar:
#   1. `phase`     — fase del proyecto actualmente habilitada. Una skill cuya
#                    `min_phase` sea mayor queda DENEGADA aunque su regla diga allow.
#                    Esto impide que una skill de hardware sea invocable en Fase 1.
#   2. `decision`  — allow | ask | deny por skill.
#
# Al añadir una skill nueva NO se le pone `allow` sin una decisión explícita:
# lo que no está listado cae al `default`, que es `ask`.

default: ask
phase: 1 # fase habilitada hoy. Subir sólo cuando la fase esté verificada.

skills:
  # ── Fase 1: sin hardware, sin efectos externos ──────────────────────────
  read_file:
    decision: allow
    min_phase: 1
    reason: "Lectura confinada a la raíz del proyecto; sin efectos secundarios."

  glob:
    decision: allow
    min_phase: 1
    reason: "Sólo lista rutas dentro de la raíz; sin efectos secundarios."

  write_note:
    decision: allow
    min_phase: 1
    reason: "Escribe sólo en var/notes/, reversible."

  search_web:
    decision: ask
    min_phase: 1
    reason: >-
      Mete texto de terceros en el razonamiento del agente. El riesgo no es el
      coste sino la inyección indirecta: una página puede contener instrucciones.

  fetch_url:
    decision: ask
    min_phase: 1
    reason: "Igual que search_web: contenido no confiable dentro del contexto."

  weather:
    decision: allow
    min_phase: 1
    reason: >-
      Datos numéricos de una API pública sin clave. No devuelve texto libre de
      terceros, así que no es vector de inyección.

  run_command:
    decision: ask
    min_phase: 1
    reason: "Ejecución de código. Allowlist en la skill; la aprobación es la segunda barrera."

  # ── Fase 2: visión e identidad ──────────────────────────────────────────
  see_screen:
    decision: ask
    min_phase: 2
    reason: "Puede capturar información sensible en pantalla."

  remember_person:
    decision: ask
    min_phase: 2
    reason: "Persiste un identificador biométrico. Requiere consentimiento explícito."

  forget_person:
    decision: allow
    min_phase: 2
    reason: "Borrar datos personales nunca debe tener fricción."

  # ── Fase 4: hardware. Denegadas hasta que la fase esté verificada ───────
  move:
    decision: ask
    min_phase: 4
    reason: "Movimiento físico. Arranca en `ask` incluso con la Fase 4 habilitada."

  turn:
    decision: ask
    min_phase: 4

  look_at:
    decision: allow
    min_phase: 4
    reason: "Servo de cámara: bajo riesgo, sin desplazamiento del chasis."

  stop:
    decision: allow
    min_phase: 4
    reason: "Detenerse SIEMPRE se permite. Nunca pedir permiso para frenar."

  # ── Memoria: el agente gestiona lo que recuerda ─────────────────────────
  remember:
    decision: allow
    min_phase: 1
    reason: "Guardar un dato es reversible y es el mecanismo central del agente."

  recall:
    decision: allow
    min_phase: 1
    reason: "Sólo lectura de su propia memoria."

  identify_speaker:
    decision: allow
    min_phase: 1
    reason: >-
      Registrar con quién se habla es el paso previo a recordar nada útil.
      Pedir permiso aquí rompería la conversación justo al presentarse.

  forget:
    decision: ask
    min_phase: 1
    reason: "Borrado irreversible: siempre se confirma."

  # ── Visión: la cámara es el sensor más invasivo que hay ─────────────────
  look:
    decision: allow
    min_phase: 1
    reason: >-
      Sólo cuenta cuántas caras hay y en qué zona del encuadre. No identifica
      a nadie ni saca la imagen del equipo.

  who_is_this:
    decision: allow
    min_phase: 1
    reason: >-
      Compara contra caras ya enroladas con consentimiento. No enrola a nadie
      nuevo, así que no puede crear un registro biométrico por su cuenta.

  remember_face:
    decision: ask
    min_phase: 1
    reason: >-
      Persiste un identificador biométrico permanente. SIEMPRE se confirma:
      un embedding facial es el rostro, no un dato anónimo.

  see:
    decision: allow
    min_phase: 1
    reason: >-
      Describe lo que hay delante con un modelo LOCAL. La imagen no sale del
      equipo, así que el riesgo es el mismo que el de `look`.

  count_fingers:
    decision: allow
    min_phase: 1
    reason: "Geometría de la mano; ni identifica ni guarda nada."

  read_expression:
    decision: allow
    min_phase: 1
    reason: "Geometría de la cara; no produce ni almacena identificador biométrico."
