[project]
name = "argos"
version = "0.1.0"
description = "Agente de IA autónomo encarnado progresivamente en hardware"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "ddgs>=9.14.4",
    "edge-tts>=7.2.8",
    "fastapi>=0.140.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "insightface>=1.0.1",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
argos = "argos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argos"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Las pruebas de integración quedan fuera del bucle rápido: `uv run pytest` debe
# funcionar en cualquier máquina, sin servidor ni GPU. Para correrlas:
#   uv run pytest -m needs_llm
addopts = "-q --strict-markers -m 'not needs_llm'"
markers = [
    # Las skills deben poder probarse SIN modelo. Cualquier test que necesite
    # un LLM se marca aquí y queda excluido del bucle rápido de desarrollo.
    "needs_llm: requiere un proveedor LLM real (excluido por defecto)",
]
